schema_version: 1

context:
  name: flask
  version: 3.1.3

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flask-${{ version }}.tar.gz
  sha256: 0ef0e52b8a9cd932855379197dd8f94047b359ca0a78695144304cb45f87c9eb

build:
  number: 1

outputs:
  - package:
      name: ${{ name }}
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - flit-core >=3.11,<4
        - pip
      run:
        - python >=${{ python_min }}
        - blinker >=1.9.0
        - click >=8.1.3
        - itsdangerous >=2.2.0
        - jinja2 >=3.1.2
        - markupsafe >=2.1.1
        - werkzeug >=3.1.0
    tests:
      - python:
          imports:
            - flask
            - flask.json
          pip_check: true
          python_version: ${{ python_min }}.*
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - flask --help
  - package:
      name: ${{ name }}-with-async
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - asgiref >=3.2
    tests:
      - python:
          imports:
            - flask
            - asgiref.sync
          pip_check: true
          python_version: ${{ python_min }}.*
  - package:
      name: ${{ name }}-with-dotenv
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - python-dotenv
    tests:
      - python:
          imports:
            - flask
            - dotenv
          pip_check: true
          python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A simple framework for building complex web applications.
  description: |
    Flask is a lightweight [WSGI](https://wsgi.readthedocs.io/) web application framework. It is designed
    to make getting started quick and easy, with the ability to scale up to
    complex applications. It began as a simple wrapper around [Werkzeug](https://werkzeug.palletsprojects.com/)
    and [Jinja](https://jinja.palletsprojects.com/) and has become one of the most popular Python web
    application frameworks.
    Flask offers suggestions, but doesn't enforce any dependencies or
    project layout. It is up to the developer to choose the tools and
    libraries they want to use. There are many extensions provided by the
    community that make adding new functionality easy.
  homepage: https://palletsprojects.com/p/flask
  repository: https://github.com/pallets/flask/
  documentation: https://flask.palletsprojects.com/

extra:
  recipe-maintainers:
    - goanpeca
    - nehaljwani
    - marcelotrevisani
    - xylar
